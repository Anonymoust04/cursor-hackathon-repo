<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ImpactHub Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6", // Blue-500 from Tailwind palette
                        "background-light": "#EFF6FF", // Blue-50
                        "background-dark": "#111827", // Gray-900
                    },
                    fontFamily: {
                        display: ["Roboto", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem", // 12px
                    },
                },
            },
        };
    </script>
<style>
        .split-bg-light {
            background-color: #DBEAFE;
        }
        .split-bg-dark {
            background-color: #1F2937;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover,
        .dark input:-webkit-autofill:focus,
        .dark input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #374151 inset !important;
            -webkit-text-fill-color: #F9FAFB !important;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-5xl bg-white dark:bg-gray-900 rounded-lg shadow-2xl flex overflow-hidden">
<div class="hidden md:flex w-1/2 split-bg-light dark:split-bg-dark p-12 flex-col justify-center items-center relative">
<img alt="Illustration of a person with a clipboard connecting with another person, symbolizing networking and social impact" class="w-full max-w-sm z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgO_z1kxkM0oShCl2MEK2v6jn2ZRATOhLjjBxhXwY99CbRkxOmPFNQKK6sFFvG-7gJNNcQa0-MDOCFSEGP83r8cS7iNbLRfbrhmOXjR367B6vPNaq5vP2L9InzaFUHI-xfaetly7gKWYXQ3lYSSInnGziBl0fV-66bE99rtAf5vjgMoCk1AFehWWCBE8Ag2vv_POTvqnCKdm61QZeNpEDTPFjDIVB7OnBqL_qy2mQXFiI6E12tnel1RjjkyqgyzQZi6nhWkk8mF1Q"/>
<div class="mt-8 text-center z-10">
<h1 class="text-4xl font-bold text-gray-800 dark:text-white">Welcome to ImpactHub</h1>
<p class="text-gray-600 dark:text-gray-300 mt-2">Connecting students and corporations for social impact.</p>
</div>
<div class="absolute top-8 left-8 w-12 h-12 bg-blue-200 dark:bg-blue-900 rounded-full opacity-50"></div>
<div class="absolute bottom-8 right-8 w-20 h-20 bg-blue-200 dark:bg-blue-900 rounded-lg opacity-50 transform rotate-45"></div>
</div>
<div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
<div class="w-full max-w-md mx-auto">
<div class="flex items-center gap-2 mb-8">
<svg class="w-8 h-8 text-primary" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.6,12.71a1,1,0,0,0,1.4,1.41l8-8A1,1,0,0,0,18.59,4.29Z"></path>
<path d="M12.4,18,9.55,15.15a1,1,0,0,0-1.41,0L3.29,20.15a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l4-4,2.5,2.5a1,1,0,0,0,1.41-1.42Z"></path>
</svg>
<h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">ImpactHub</h2>
</div>
<form>
<div class="mb-4">
<label class="block mb-2 text-sm font-medium text-gray-600 dark:text-gray-300" for="email">Username or E-mail</label>
<input class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-gray-900 dark:text-gray-100 focus:ring-primary focus:border-primary" id="email" placeholder="your.email@example.com" type="email"/>
</div>
<div class="mb-4">
<label class="block mb-2 text-sm font-medium text-gray-600 dark:text-gray-300" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-gray-900 dark:text-gray-100 focus:ring-primary focus:border-primary" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-gray-400" type="button">
<span class="material-icons-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="mb-6">
<label class="block mb-2 text-sm font-medium text-gray-600 dark:text-gray-300" for="role">I am a</label>
<select class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-gray-900 dark:text-gray-100 focus:ring-primary focus:border-primary" id="role">
<option>Job Applicant</option>
<option>Job Poster</option>
</select>
</div>
<button class="w-full bg-primary text-white font-bold py-3 px-4 rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 transition-colors duration-300" type="submit">
                        Log In
                    </button>
</form>
<div class="relative my-6">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-gray-900 text-gray-500 dark:text-gray-400">Or continue with</span>
</div>
</div>
<div class="space-y-3">
<button class="w-full flex items-center justify-center gap-3 py-2 px-4 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 transition-colors duration-300">
<svg class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" fill="#FFC107"></path><path d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" fill="#FF3D00"></path><path d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.222,0-9.657-3.356-11.303-7.962l-6.571,4.819C9.656,39.663,16.318,44,24,44z" fill="#4CAF50"></path><path d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C44.577,34.237,48,27.461,48,20C48,17.341,47.862,14.65,47.611,12.083z" fill="#1976D2"></path></svg>
<span class="text-sm font-medium text-gray-700 dark:text-gray-200">Continue with Google</span>
</button>
<button class="w-full flex items-center justify-center gap-3 py-2 px-4 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 transition-colors duration-300">
<svg class="w-5 h-5" fill="#0077B5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"></path></svg>
<span class="text-sm font-medium text-gray-700 dark:text-gray-200">Continue with LinkedIn</span>
</button>
<button class="w-full flex items-center justify-center gap-3 py-2 px-4 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 transition-colors duration-300">
<svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"></path></svg>
<span class="text-sm font-medium text-gray-700 dark:text-gray-200">Continue with Facebook</span>
</button>
</div>
<div class="mt-6 text-center">
<a class="text-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="mt-4 text-center">
<p class="text-sm text-gray-600 dark:text-gray-300">
                        Do Not Have Account? <a class="font-medium text-primary hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</div>

</body></html>
